<!doctype html>
<html lang="es">

    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />

    />

    <link rel="stylesheet" href="styles/navigation.css?v=nav-stable-4" />
  </head>
  <body>
    <main class="scroll">
      <h1 style="margin: 0 0 4px; font-size: 20px">
        Pedidos disponibles
      </h1>
      <p
        style="
          margin: 0 0 18px;
          color: #9ca3af;
          font-size: 12px;
        "
      >
        Acepta los pedidos que quieras entregar
      </p>
      <div id="orders"></div>
    </main>
    <nav
      class="bottom-nav"
      aria-label="Navegaci?n principal"
    >
      <a
        href="inicio.html"
        class="nav-item"
        aria-label="Inicio"
        ><svg
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 10.5 12 3l9 7.5v8.25A2.25 2.25 0 0 1 18.75 21H5.25A2.25 2.25 0 0 1 3 18.75V10.5Z"
          /></svg
          <path d="M9 21v-5.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V21" /></svg
        ><span>Inicio</span></a
      >
      <a
        href="activos.html"
        class="nav-item"
        aria-label="Activos"
      >
        <svg
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m4 7 8-4 8 4-8 4-8-4Zm0 0v10l8 4 8-4V7M12 11v10"
          /></svg
        ><span>Activos</span
        ><b class="badge" id="badge-activos"></b
      ></a>
      <button
        id="delivery-status-toggle"
        class="nav-status-toggle"
        type="button"
        aria-pressed="false"
      >
        <span class="nav-status-icon"
          ><svg
            width="18"
            height="18"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path
              stroke-linecap="round"
              d="M12 2v10m0 0 4-4m-4 4-4-4M5 13v4a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-4"
            /></svg
        ></span>
        <span class="nav-status-label">Activo</span>
      </button>
      <a
        href="notificaciones.php"
        class="nav-item"
        aria-label="Notificaciones"
        ><svg
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 13h4"
          /></svg

        ><b class="badge" id="badge-notificaciones"></b
      ></a>
      <a
        href="../php/perfil.php"
        class="nav-item"
        aria-label="Perfil"
        ><svg
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"

      >
    </nav>
    <div id="chat-root"></div>
    <script src="../js/data.js"></script>
    <script src="../js/chat.js?v=compact-2"></script>
    <script>
      async function render() {
        const result = await cargarEntregas("available");
        const list = result.items || [];
        const full = false;
        document.querySelector("#orders").innerHTML =
          list.length
            ? list
                .map(
                  (p) =>
                    `<article class="card order">
                      <div class="order-head">
                        <div class="order-main">
                          <p class="name">${p.cliente_nombre} ${p.cliente_apellido}</p>
                          <p class="muted">Pedido #${p.id_pedido}</p>
                        </div>
                        <div class="earn"><strong>${fmt(p.total)}</strong></div>
                      </div>
                      <div class="route">📍 Recoger: ${p.negocio_nombre}<br>🏁 Entregar: ${p.direccion_entrega}</div>
                      ${
                        p.pedido_estado === "Preparado"
                          ? `<div style="background:#ecfdf5;border:1px solid #a7f3d0;color:#047857;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:800;margin:8px 0">
                              🧑‍🍳 ¡Plato PREPARADO y listo para recoger!
                             </div>`
                          : p.tiempo_preparacion
                            ? `<div style="background:#fff7ed;border:1px solid #fed7aa;color:#c2410c;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:800;margin:8px 0">
                                ⏱️ Tiempo prep: ~${p.minutos_restantes !== null && p.minutos_restantes > 0 ? p.minutos_restantes + " min restantes" : p.tiempo_preparacion + " min"}
                               </div>`
                            : ""
                      }
                      <div class="actions">
                        <button class="btn-green" ${full ? 'disabled style="opacity:.55"' : ""} onclick="accept('${p.id_entrega}')">
                          Aceptar pedido
                        </button>
                      </div>
                    </article>`,
                )
                .join("")
            : `<div class="card" style="padding:32px;text-align:center;color:#9ca3af;font-size:13px">No hay pedidos disponibles ahora</div>`;
      }
      async function accept(id) {
        try {
          await actualizarEntrega("accept", id);
          window.location.href = "activos.html";
        } catch (error) {
          alert(error.message);
        }
      }
      render();
      iniciarBotonEstadoRepartidor();
      initChat();
    </script>
  </body>
</html>
