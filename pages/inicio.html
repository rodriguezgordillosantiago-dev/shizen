<script>
function fmt(n) { return '$' + Number(n).toLocaleString('es-CO'); }

let isOnline = true;

async function loadData() {
  try {
    const stats = await cargarEstadisticas();
    document.getElementById('ganancias-hoy').textContent = fmt(stats.gananciasHoy || 0);
  } catch (e) {
    console.error(e);
  }

  try {
    const [activeRes, availRes] = await Promise.all([
      cargarEntregas('active'),
      cargarEntregas('available')
    ]);

    const activos = activeRes.items || [];
    const disponibles = availRes.items || [];

    // Badges
    const bAct = document.getElementById('nav-badge-activos');
    if (bAct) {
      bAct.textContent = activos.length;
      bAct.style.display = activos.length > 0 ? 'block' : 'none';
    }

    // Pill text
    const pill = document.getElementById('pill-text');
    if (pill) {
      if (activos.length > 0) {
        pill.textContent = activos.length === 1 ? '1 pedido en curso' : `${activos.length} pedidos en curso`;
      } else if (disponibles.length > 0) {
        pill.textContent = disponibles.length === 1 ? '1 oferta disponible' : `${disponibles.length} ofertas disponibles`;
      } else {
        pill.textContent = 'Buscando pedidos...';
      }
    }

    // Floating price tags
    if (disponibles.length > 0) {
      if (disponibles[0]) document.getElementById('tag-price-1').textContent = fmt(disponibles[0].total);
      if (disponibles[1]) document.getElementById('tag-price-2').textContent = fmt(disponibles[1].total);
      if (disponibles[2]) document.getElementById('tag-price-3').textContent = fmt(disponibles[2].total);
    }
  } catch (e) {
    console.error(e);
  }

  // Notificaciones unread badge
  try {
    const resp = await fetch('../php/notificaciones.php');
    if (resp.ok) {
      const notifData = await resp.json();
      const unread = (notifData.items || []).filter(n => Number(n.leida) === 0).length;
      const bAv = document.getElementById('nav-badge-avisos');
      if (bAv && unread > 0) {
        bAv.textContent = unread;
        bAv.style.display = 'block';
      }
    }
  } catch (e) {}
}

async function toggleOnline() {
  try {
    isOnline = await cambiarEstadoRepartidor();
  } catch (e) {
    isOnline = !isOnline;
  }
  updateOnlineUI();
}

function updateOnlineUI() {
  const title = document.getElementById('toggle-title');
  const sub = document.getElementById('toggle-sub');
  const wrap = document.querySelector('.toggle-conexion-wrap');
  
  if (isOnline) {
    title.textContent = 'En línea';
    sub.textContent = 'Recibiendo pedidos';
    wrap.classList.remove('is-offline');
  } else {
    title.textContent = 'Desconectado';
    sub.textContent = 'No recibirás ofertas';
    wrap.classList.add('is-offline');
  }
}

isOnline = repartidorEstaActivo();
updateOnlineUI();
loadData();
</script>
