<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shizen — Historial</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/styles.css?v=20261009-final" />
    <link rel="stylesheet" href="styles/historial.css" />
  </head>
  <body>
    <div class="pantalla pantalla-marco">
      <div class="contenedor-activos-scroll">
        <div class="activos-cabecera">
          <div class="activos-logo-fila">
            <img src="logos/shizen-color.png" alt="Shizen food" class="activos-logo-img">
          </div>
          <h1 class="activos-titulo">Historial</h1>
          <p class="activos-resumen">Tus últimas entregas completadas</p>
        </div>
        <div id="list"></div>
      </div>

      <!-- Reusable Native HTML Navbar (Shizen App) -->
      <nav aria-label="Navegación principal" class="nav-barra">
        <button type="button" aria-label="Inicio" class="nav-btn" onclick="window.location.href='inicio.html'">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-6h4v6"></path></svg>
          <span class="nav-label">Inicio</span>
        </button>
        <button type="button" aria-label="Activos" class="nav-btn" onclick="window.location.href='activos.html'">
          <span class="nav-icono-wrap">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg>
            <span class="nav-badge" id="nav-badge-activos" style="display:none">0</span>
          </span>
          <span class="nav-label">Activos</span>
        </button>
        <button type="button" aria-label="Avisos" class="nav-btn" onclick="window.location.href='notificaciones.php'">
          <span class="nav-icono-wrap">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15L6 17z"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg>
            <span class="nav-badge" id="nav-badge-avisos" style="display:none">0</span>
          </span>
          <span class="nav-label">Avisos</span>
        </button>
        <button type="button" aria-label="Perfil" class="nav-btn-activo" onclick="window.location.href='../php/perfil.php'">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-3.9 3.6-6 8-6s8 2.1 8 6"></path></svg>
          <span class="nav-label-activo">Perfil</span>
        </button>
      </nav>
    </div>

    <div id="chat-root"></div>

    <script src="../js/data.js"></script>
    <script src="../js/chat.js"></script>
    <script>
      async function render() {
        const result = await cargarEntregas("history");
        const historial = result.items;
        const list = document.getElementById("list");

        if (historial.length === 0) {
          list.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;text-align:center">
          <svg width="56" height="56" fill="none" viewBox="0 0 24 24" stroke="#e5e7eb" stroke-width="1.5" style="margin-bottom:12px">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
          <p style="margin:0 0 4px;font-size:14px;font-weight:700;color:#9ca3af">Sin historial aún</p>
        </div>`;
          return;
        }

        list.innerHTML = historial
          .map((p) => {
            const ok = p.entrega_estado === "Entregado";
            return `
        <div style="display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #f3f4f6">
          <div style="width:44px;height:44px;border-radius:50%;background:#e8f5e9;color:#2d6a31;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0">${(p.cliente_nombre || "?").slice(0,1)}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
              <p style="margin:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.cliente_nombre} ${p.cliente_apellido}</p>
              <span style="flex-shrink:0;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;
                background:${ok ? "#f0fdf4" : "#fef2f2"};color:${ok ? "#166534" : "#dc2626"}">
                ${ok ? "Entregado" : "Cancelado"}
              </span>
            </div>
            <p style="margin:0 0 1px;font-size:11px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Pedido #${p.id_pedido} · ${p.negocio_nombre}</p>
            <p style="margin:0;font-size:11px;color:#d1d5db">${p.fecha_entrega || ""}</p>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <p style="margin:0 0 1px;font-size:14px;font-weight:800;color:${ok ? "#4c9540" : "#d1d5db"};${!ok ? "text-decoration:line-through" : ""}">${fmt(p.total)}</p>
          </div>
        </div>`;
          })
          .join("");
      }

      render();
      updateNavBadges();
      initChat();
    </script>
  </body>
</html>
